services:
  docling-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - TARGET_DEVICE=gpu
    ports:
      - "8090:8000"
    extra_hosts:
      # Linux環境のDockerでも host.docker.internal 経由でホストPC上のサービス（Ollama等）に接続可能にする
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    volumes:
      # 各ディレクトリを個別にマウントし、コンテナ内の仮想環境（.venv）の上書きを防ぐ
      - ./src:/app/src
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      - ./output:/app/output
      - docling_data:/app/data
    environment:
      - DOCLING_UPLOAD_DIR=/app/data/uploads
      - DOCLING_OUTPUT_DIR=/app/data/output
      - HF_HOME=/app/data/models
      - DOCLING_RATE_LIMIT_REQUESTS=100
    # 開発用コマンド。本番用は Dockerfile の CMD を使用。
    command: uvicorn docling_lib.server:app --host 0.0.0.0 --port 8000 --reload
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-3}"

volumes:
  # 名前付きボリュームを使うことで、ホストの権限問題を回避しつつデータを永続化
  docling_data:
