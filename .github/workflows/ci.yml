name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install Linting, Testing & Security Tools
      run: |
        python -m pip install --upgrade pip
        pip install ruff bandit pip-audit pytest httpx
        
    - name: Lint with ruff
      run: ruff check .
      
    - name: Security check with bandit
      run: bandit -r src/ -ll
      
    - name: Dependency audit with pip-audit
      # Scan local package dependencies using pip-audit
      run: pip-audit --local
      
    - name: Run lightweight unit tests
      run: |
        # Run only lightweight logic-only unit tests that don't depend on heavy ML libraries (PyTorch/Docling)
        PYTHONPATH=src pytest tests/test_utils.py tests/test_config.py
