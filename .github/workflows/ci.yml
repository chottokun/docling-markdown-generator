name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install Linting & Security Tools
      run: |
        python -m pip install --upgrade pip
        pip install ruff bandit pip-audit
        
    - name: Lint with ruff
      run: ruff check .
      
    - name: Security check with bandit
      run: bandit -r src/ -ll
      
    - name: Install project package
      run: pip install .
      
    - name: Dependency audit with pip-audit
      run: pip-audit

  test:
    needs: lint-and-security
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        # Install libgl1 and libglx-mesa0 for OpenCV (RapidOCR dependency)
        # libgl1-mesa-glx is deprecated/removed in newer Ubuntu versions
        sudo apt-get install -y libgl1 libglx-mesa0

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"
        
    - name: Run pytest
      run: |
        # Run tests (excluding the environment-specific CUDA test if necessary, 
        # but standard CPU fallback should handle the e2e test on GitHub Actions)
        pytest

  docker-security:
    needs: lint-and-security
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Build local Docker image
      run: |
        docker build -t docling-markdown-generator:latest .
        
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'docling-markdown-generator:latest'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
