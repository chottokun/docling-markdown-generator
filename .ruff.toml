# Ruff configuration
line-length = 88
target-version = "py311"

[lint]
# Enable specific rule sets
# E: pycodestyle errors
# F: Pyflakes
# I: isort
# UP: pyupgrade
# S: flake8-bandit (Security)
# B: flake8-bugbear
select = ["E", "F", "I", "UP", "S", "B"]

# Ignore rules that are too strict for this project or handled elsewhere
ignore = [
    "E501", # Line too long (handled by formatter or ignored for readability)
    "S101", # Use of assert (common in tests)
    "B008", # Do not perform function call in argument defaults (common in FastAPI)
    "S110", # try-except-pass (sometimes intentional, bandit flags it)
    "S113", # Probable use of requests call without timeout
    "E722", # Do not use bare except
]

[lint.per-file-ignores]
"tests/*" = ["S101", "E402", "S108", "F841", "E701"] # Allow asserts in tests
